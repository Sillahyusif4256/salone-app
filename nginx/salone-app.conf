server {
    listen 80; # Listen for HTTP requests on port 80.
    server_name localhost; # Match requests made to localhost.

    location / {
        proxy_pass http://127.0.0.1:8080; # Forward requests to the Docker-published app port.
        proxy_set_header Host $host; # Pass the original requested host to the app.
        proxy_set_header X-Real-IP $remote_addr; # Pass the visitor's IP address to the app.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; # Preserve the forwarding IP chain.
    }
}
